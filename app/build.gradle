apply plugin: "com.android.application"

android {
    namespace 'io.github.bandbridge'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.bandbridge'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.1.13'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation project(':bandcore')
}